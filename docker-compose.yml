services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veyrivo
      POSTGRES_USER: veyrivo
      POSTGRES_PASSWORD: veyrivo_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyrivo -d veyrivo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - veyrivo_postgres:/var/lib/postgresql/data

volumes:
  veyrivo_postgres:
